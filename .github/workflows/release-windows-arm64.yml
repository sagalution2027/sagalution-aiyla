name: Controlled Windows ARM64 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.3.1-github-test"
        required: true
        default: "v0.3.1-github-test"
        type: string
      publish_release:
        description: "Publish the installer to a public GitHub Release after the build succeeds"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows-arm64:
    name: Test and build Windows ARM64 installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the approved Aiyla source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local safety and acknowledgement tests
        run: pnpm test

      - name: Build assisted Windows ARM64 installer
        run: pnpm exec electron-builder --win nsis --arm64 --publish never

      - name: Validate fresh installer and Command Centre shortcut
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "Aiyla Command Centre Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Expected Aiyla Command Centre installer was not produced." }

          $installDirectory = Join-Path $env:RUNNER_TEMP "AiylaCommandCentreInstallTest"
          Remove-Item -Path $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', "/D=$installDirectory") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent installer returned exit code $($installProcess.ExitCode)." }

          $appPath = Join-Path $installDirectory "Aiyla Command Centre.exe"
          if (-not (Test-Path -LiteralPath $appPath)) { throw "Installed Aiyla Command Centre executable was not found." }

          $startMenuShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Aiyla Command Centre.lnk"
          if (-not (Test-Path -LiteralPath $startMenuShortcut)) { throw "Aiyla Command Centre Start Menu shortcut was not created." }

          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($startMenuShortcut)
          if ($shortcut.TargetPath -ne $appPath) {
            throw "Shortcut target is wrong: expected '$appPath'; received '$($shortcut.TargetPath)'."
          }

          if ($shortcut.TargetPath -match 'ARCHIVE|Aiyla-0\.1\.0') {
            throw "Shortcut incorrectly refers to an archived Aiyla build."
          }

      - name: Create release checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "Aiyla Command Centre Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Expected Aiyla installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          $releaseAssetName = $installer.Name -replace ' ', '.'
          "$hash  $releaseAssetName" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload installer and checksum for review
        uses: actions/upload-artifact@v4
        with:
          name: aiyla-windows-arm64-installer
          path: |
            dist/Aiyla Command Centre Setup *.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish controlled public GitHub Release
        if: ${{ inputs.publish_release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v0.3.1-github-test."
          }
          $installer = Get-ChildItem -Path dist -Filter "Aiyla Command Centre Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Expected Aiyla installer was not produced." }
          gh release create $tag $installer.FullName "dist/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "Aiyla $tag — Windows ARM64 controlled installer test" --notes "Controlled unsigned Windows ARM64 installer test. Smart App Control remains enabled during device testing. This release does not claim code-signing trust. Verify the SHA-256 checksum before use."
